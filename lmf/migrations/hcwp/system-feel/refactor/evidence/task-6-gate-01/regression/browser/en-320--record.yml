- main:
  - 'heading "Important: Demonstration — synthetic patient data" [level=2]'
  - paragraph: "Local demonstration only. Not for clinical use. Fixed clock: 15 March 2025."
  - region "Selected synthetic patient":
    - heading "Selected synthetic patient" [level=2]
    - term: Full name
    - definition: Mx Synthetic, Example One
    - term: NHS number
    - definition: SYN-NHS-101
    - term: Date of birth
    - definition: 1 January 2025
    - term: Age
    - definition: 10 weeks
    - term: Sex
    - definition: Male
    - term: Address
    - definition: 1 Synthetic Lane, Invented District, SYN POST 1
    - term: Current status
    - definition: Synthetic active status (demonstration fixture)
    - term: School
    - definition: Synthetic School One — legacy format unavailable (CodeDescriptionFormat)
    - term: Health board
    - definition: SYNORG1, Cardiff and Vale University Health Board
  - heading "6–8-week contact (KD03)" [level=1]
  - paragraph: Record a 6–8-week contact for the selected synthetic patient. KD03 only.
  - paragraph:
    - link "Back to HCWP results":
      - /url: /results
  - paragraph: "Fixed demonstration clock: 15 March 2025. Temporary in-memory data; not clinical policy."
  - paragraph: Fields are optional individually. General assessment alone does not count as a result. Warnings use resource identities; original localised prose is unavailable.
  - group "New KD03 result":
    - text: New KD03 result Contact date
    - textbox "Contact date": 2025-02-19
    - text: Origin
    - combobox "Origin":
      - option "Not recorded"
      - option "Scheduled"
      - option "Unscheduled" [selected]
      - option "Movement In"
      - option "Amendment"
      - option "Not Known"
    - text: Reason not examined
    - combobox "Reason not examined":
      - option "Not recorded" [selected]
      - option "Was not brought"
      - option "Unwell or uncooperative child"
      - option "Examination refused"
      - option "Parent / Carer not present"
      - option "Not required"
    - text: Consent
